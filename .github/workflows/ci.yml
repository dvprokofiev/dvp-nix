name: Check flake
on:
  pull_request:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run nix flake check
        run: nix flake check
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Scan for Critical Vulnerabilities
        run: |
          nix build .#nixosConfigurations.cluster.config.system.build.toplevel
          nix run nixpkgs#trivy -- fs ./result \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 0
    
